<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Consolas', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1F20"/>
      <stop offset="100%" stop-color="#151617"/>
    </linearGradient>
  </defs>

  <!-- outer glow border, subtle pulse -->
  <rect x="2" y="2" width="796" height="396" rx="14" fill="none" stroke="#22d3c8" stroke-width="1.5" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal body -->
  <rect x="4" y="4" width="792" height="392" rx="12" fill="url(#bg)" stroke="#2d2f31" stroke-width="1"/>

  <!-- title bar -->
  <rect x="4" y="4" width="792" height="34" rx="12" fill="#17181a"/>
  <rect x="4" y="22" width="792" height="16" fill="#17181a"/>
  <line x1="4" y1="38" x2="796" y2="38" stroke="#2d2f31" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="28" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="21" r="6" fill="#27C93F"/>

  <!-- title -->
  <text x="400" y="26" text-anchor="middle" font-size="13" fill="#8a8d90">ganesh@dev — zsh</text>

  <!-- ============ ANIMATED CONTENT ============ -->

  <!-- $ whoami -->
  <text x="36" y="72" font-size="17" fill="#22d3c8" opacity="0">$ whoami
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.010;0.020;0.240;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="98" font-size="17" fill="#e6e6e6" opacity="0">ganesh
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.040;0.050;0.240;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- $ ./stack.sh -->
  <text x="36" y="142" font-size="17" fill="#22d3c8" opacity="0">$ ./stack.sh
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.270;0.280;0.620;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>

  <text x="56" y="170" font-size="16" fill="#e6e6e6" opacity="0">→ React · TypeScript
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.310;0.320;0.620;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="56" y="196" font-size="16" fill="#e6e6e6" opacity="0">→ NestJS · Express
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.350;0.360;0.620;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="56" y="222" font-size="16" fill="#e6e6e6" opacity="0">→ Flutter
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.390;0.400;0.620;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="56" y="248" font-size="16" fill="#e6e6e6" opacity="0">→ MongoDB · PostgreSQL · Prisma
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.430;0.440;0.620;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="56" y="274" font-size="16" fill="#e6e6e6" opacity="0">→ REST APIs · RBAC
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.470;0.480;0.620;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- $ status -->
  <text x="36" y="318" font-size="17" fill="#22d3c8" opacity="0">$ status
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.650;0.660;0.970;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="344" font-size="17" fill="#e6e6e6" opacity="0">
    <tspan fill="#27C93F">●</tspan> ONLINE — BUILDING 🚀
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.690;0.700;0.970;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor, always alive -->
  <text x="36" y="372" font-size="17" fill="#22d3c8">$ <tspan fill="#22d3c8">_
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </tspan></text>

</svg>
