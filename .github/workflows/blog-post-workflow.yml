name: Latest blog post workflow

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest Medium posts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@shitganesh4"

          max_post_count: 5

          date_format: "mmm d, yyyy"

          disable_html_encoding: true

          template: |
            <table>
              <tr>
                <td width="33%" valign="top">
                  <a href="$url">
                    $description
                  </a>
                  <br>
                  <h3>
                    <a href="$url">$title</a>
                  </h3>
                  <p>📅 $date</p>
                </td>
              </tr>
            </table>

          item_exec: |
            post.description = post.description.match(/<img[^>]+src="([^"]+)"/)?.[1]
              ? `<img src="${post.description.match(/<img[^>]+src="([^"]+)"/)[1]}" width="100%" />`
              : ""
